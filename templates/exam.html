{% extends 'base.html' %}{% block content %}<div class="exam-head"><span class="exam-title">{{ exam.title }}</span><span id="save-status" class="save-status"></span><span class="timer">Time left: <span id="timer"></span></span></div>
<form id="exam-form" method="post" action="{{ url_for('submit_exam',exam_id=exam.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% for q in questions %}<div class="question"><div class="question-title">Q{{ loop.index }}. {{ q.question }}</div>{% for key,value in [('A',q.option_a),('B',q.option_b),('C',q.option_c),('D',q.option_d)] %}<label class="option"><input type="radio" name="q_{{ q.id }}" value="{{ key }}" {% if answers.get(q.id)==key %}checked{% endif %} onchange="saveAnswer({{ exam.id }},{{ q.id }},'{{ key }}')"><span><strong>{{ key }}.</strong> {{ value }}</span></label>{% endfor %}</div>{% endfor %}<button onclick="return confirm('Submit exam now?')">Submit Exam</button></form>
<script src="{{ url_for('static',filename='app.js') }}"></script><script>startTimer({{ end_epoch }});</script>{% endblock %}
