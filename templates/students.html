{% extends 'base.html' %}{% block content %}<div class="page-head"><div class="eyebrow">Candidate management</div><h1>Students</h1></div>
<div class="card"><h2>Add Student</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="grid"><div><label>Roll Number</label><input name="roll_no" required></div><div><label>Name</label><input name="name" required></div><div><label>Password</label><input name="password" type="password" required></div></div><button>Add Student</button></form></div>
<div class="card"><h2>Registered Students</h2><div class="table-wrap"><table><tr><th>Roll No</th><th>Name</th><th>Created</th></tr>{% for s in students %}<tr><td><strong>{{ s.roll_no }}</strong></td><td>{{ s.name }}</td><td>{{ s.created_at|dt }}</td></tr>{% else %}<tr><td colspan="3">No students added yet.</td></tr>{% endfor %}</table></div></div>{% endblock %}
