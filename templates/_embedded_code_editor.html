<section class="card code-editor-card embedded-code-editor" id="student-code-editor" data-run-url="{{ url_for('student_code_editor_run') }}" data-exam-id="{{ exam.id }}">
  <div class="code-editor-toolbar"><label for="code-language">Language<select id="code-language">{% for key,item in code_editor_languages.items() %}<option value="{{ key }}"{% if key=='python' %} selected{% endif %}>{{ item.label }}</option>{% endfor %}</select></label><div class="actions"><button class="btn secondary small" type="button" id="code-reset">Reset</button><button class="btn small" type="button" id="code-run">▶ Run Code</button></div></div>
  <div class="code-workspace"><div class="code-pane"><div class="code-pane-title"><span>Source code</span><small id="code-status">Ready</small></div><div class="code-source-editor"><pre class="code-line-numbers" id="code-line-numbers" aria-hidden="true">1</pre><div class="code-source-input"><pre class="code-bracket-layer" id="code-bracket-layer" aria-hidden="true"></pre><textarea id="code-source" aria-label="Source code" spellcheck="false"></textarea></div></div></div><div class="code-side-panel"><div class="code-pane code-input-pane"><div class="code-pane-title"><span>Input</span><small>Optional</small></div><textarea id="code-stdin" placeholder="Input values"></textarea></div><div class="code-pane code-output-pane"><div class="code-pane-title"><span>Output</span><button type="button" class="code-clear-output" id="code-clear">Clear</button></div><pre id="code-output" aria-live="polite">Run your program to test it.</pre></div></div></div>
</section>
