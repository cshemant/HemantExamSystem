{% extends 'base.html' %}{% block content %}
<div class="page-head"><div class="eyebrow">White-label configuration</div><h1>Institution Profile</h1><p class="muted">Use the same product for different colleges or universities without changing application code.</p></div>
<div class="card"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<div class="grid"><div><label>Institution / University Name</label><input name="institution_name" value="{{ profile.institution_name }}" required></div><div><label>Short Name</label><input name="short_name" value="{{ profile.short_name }}"></div><div><label>System Name</label><input name="system_name" value="{{ profile.system_name }}"></div><div><label>Department</label><input name="department" value="{{ profile.department }}"></div><div><label>Academic Year</label><input name="academic_year" value="{{ profile.academic_year }}"></div><div><label>Exam Controller</label><input name="exam_controller" value="{{ profile.exam_controller }}"></div><div><label>Admin Email</label><input type="email" name="admin_email" value="{{ profile.admin_email }}"></div><div><label>Contact Phone</label><input name="contact_phone" value="{{ profile.contact_phone }}"></div></div>
<div class="branding-row"><div>{% if profile.logo_data %}<img class="institution-preview-logo" src="{{ profile.logo_data }}" alt="Current logo">{% endif %}</div><div><label>Institution Logo</label><input type="file" name="logo_file" accept="image/png,image/jpeg,image/webp"><label class="checkline"><input type="checkbox" name="remove_logo" value="1"> Remove custom logo and use default logo</label><p class="mini-meta">PNG/JPG/WebP, maximum 1 MB.</p></div></div>
<button>Save Institution Profile</button></form></div>
{% endblock %}
