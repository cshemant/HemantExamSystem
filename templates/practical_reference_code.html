{% extends 'base.html' %}{% block content %}
<div class="page-head"><div><a class="back-link" href="{{ url_for('practical_register_detail',register_id=register.id) }}">← {{ register.section or register.subject }}</a><h1>Experiment {{ experiment.experiment_no }} · Reference Code</h1><p class="muted">{{ experiment.title }}</p></div></div>
<div class="card">
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Reference Code</label>
    <textarea name="reference_code" rows="20" spellcheck="false" placeholder="Paste the correct experiment code here...">{{ experiment.reference_code }}</textarea>
    <label>or upload code file</label>
    <input type="file" name="code_file" accept=".txt,.java,.kt,.xml,.c,.cpp,.py,.html,.js,.css">
    <div class="actions"><button type="submit">Save Reference Code</button><a class="btn secondary" href="{{ url_for('practical_register_detail',register_id=register.id) }}">Cancel</a></div>
  </form>
</div>
{% endblock %}
