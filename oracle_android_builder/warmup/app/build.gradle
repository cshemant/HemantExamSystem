plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'com.learnwithhemant.warmup'
    compileSdk 35
    defaultConfig { applicationId 'com.learnwithhemant.warmup'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }
    signingConfigs { debug { storeFile file(System.getenv('ANDROID_DEBUG_KEYSTORE')); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { debug { signingConfig signingConfigs.debug } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
