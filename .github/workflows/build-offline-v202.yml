name: Build Offline Exam V2.02

on:
  push:
    tags:
      - 'v2.02'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-offline-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-offline-build.txt

      - name: Compile protected one-click Windows executable
        shell: pwsh
        run: |
          python -m nuitka `
            --onefile `
            --assume-yes-for-downloads `
            --output-dir=build-offline `
            --output-filename=LearnWithHemantOfflineExam.exe `
            --include-data-dir=templates=templates `
            --include-data-dir=static=static `
            --include-data-file=preloaded_question_banks.json=preloaded_question_banks.json `
            --company-name="Learn with Hemant" `
            --product-name="Learn with Hemant Offline Exam" `
            --file-description="Offline LAN Examination System" `
            --file-version=2.0.2.0 `
            --product-version=2.0.2.0 `
            offline_launcher.py

      - name: Restore optional code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          if ($env:WINDOWS_CERT_BASE64) {
            [IO.File]::WriteAllBytes("codesign.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            "SIGNING_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "SIGNING_ENABLED=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Sign application executable when certificate is configured
        if: env.SIGNING_ENABLED == '1'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found on the runner." }
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f codesign.pfx /p "$env:WINDOWS_CERT_PASSWORD" build-offline\LearnWithHemantOfflineExam.exe

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Sign installer when certificate is configured
        if: env.SIGNING_ENABLED == '1'
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found on the runner." }
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f codesign.pfx /p "$env:WINDOWS_CERT_PASSWORD" installer-output\LearnWithHemantExamSetup_V2.02.exe

      - name: Prepare V2.02 download package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build-offline\LearnWithHemantOfflineExam.exe release\LearnWithHemantOfflineExam.exe
          Copy-Item OFFLINE_V2.02_README.txt release\README.txt
          Compress-Archive -Path release\LearnWithHemantOfflineExam.exe,release\README.txt -DestinationPath LearnWithHemant_Offline_Exam_V2.02_Windows.zip -Force
          $hash = (Get-FileHash LearnWithHemant_Offline_Exam_V2.02_Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  LearnWithHemant_Offline_Exam_V2.02_Windows.zip" | Set-Content LearnWithHemant_Offline_Exam_V2.02_Windows.zip.sha256 -Encoding ascii
          $setupHash = (Get-FileHash installer-output\LearnWithHemantExamSetup_V2.02.exe -Algorithm SHA256).Hash.ToLower()
          "$setupHash  LearnWithHemantExamSetup_V2.02.exe" | Set-Content LearnWithHemantExamSetup_V2.02.exe.sha256 -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LearnWithHemant-Offline-V2.02-Windows
          path: |
            LearnWithHemant_Offline_Exam_V2.02_Windows.zip
            LearnWithHemant_Offline_Exam_V2.02_Windows.zip.sha256
            installer-output/LearnWithHemantExamSetup_V2.02.exe
            LearnWithHemantExamSetup_V2.02.exe.sha256

      - name: Publish permanent GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v2.02')
        uses: softprops/action-gh-release@v2
        with:
          name: Learn with Hemant Offline Exam V2.02
          body: |
            Offline/LAN Windows build for colleges and faculty.

            - One-click launcher opens the login/setup page automatically.
            - No Internet is required during the exam.
            - SQLite data persists in the Windows user's LocalAppData folder.
            - No default administrator password is included; first launch creates the admin account.
            - SHA-256 checksum is included for integrity verification.
          files: |
            LearnWithHemant_Offline_Exam_V2.02_Windows.zip
            LearnWithHemant_Offline_Exam_V2.02_Windows.zip.sha256
            installer-output/LearnWithHemantExamSetup_V2.02.exe
            LearnWithHemantExamSetup_V2.02.exe.sha256
