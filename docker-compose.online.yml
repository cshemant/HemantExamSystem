services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: examdb
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_password_change_me
    volumes:
      - exam_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_user -d examdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_MODE: online
      SECRET_KEY: replace-with-a-long-random-secret
      SUPER_ADMIN_USERNAME: superadmin
      LEGACY_ADMIN_USERNAME: admin
      ADMIN_PASSWORD: replace-with-a-strong-admin-password
      DATABASE_URL: postgresql+psycopg://exam_user:exam_password_change_me@db:5432/examdb
      PORT: 8080
      COOKIE_SECURE: 0
    depends_on:
      db:
        condition: service_healthy

volumes:
  exam_pg_data:
